<!doctype html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI Cloud Studio — demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <p class="eyebrow">Boshlang‘ich demo</p>
    <h1>AI Cloud Studio</h1>
    <p>Video generatsiya, montaj, subtitr va retush xizmatlari uchun kelajakdagi platforma.</p>
    <div class="grid">
      <section><h2>AI video</h2><p>Hozircha ulanmagan</p></section>
      <section><h2>Avtomatik subtitr</h2><p>Hozircha ulanmagan</p></section>
      <section><h2>AI retush</h2><p>Hozircha ulanmagan</p></section>
      <section><h2>Kredit tizimi</h2><p>Hozircha ulanmagan</p></section>
    </div>
    <form id="idea-form">
      <label for="idea">Birinchi loyiha g‘oyangiz</label>
      <textarea id="idea" rows="3" placeholder="Masalan: ro‘mol reklamasi uchun 15 soniyalik video"></textarea>
      <button type="submit">Brauzerda saqlash</button>
      <p id="status" role="status"></p>
    </form>
  </main>
  <script src="app.js"></script>
</body>
</html>
